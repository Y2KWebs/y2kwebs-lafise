name: Plugin checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP ${{ matrix.php }} / protocol / JWE / package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, dom
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Syntax and publication checks
        run: |
          git ls-files -z '*.php' | xargs -0 -r -n1 php -l
          python scripts/check_public.py
      - name: Protocol and transport
        run: |
          php tests/unit.php
          php tests/bank.php
      - name: Browser encryption
        run: node --test tests/jwe.test.mjs
      - name: Packaging regression tests
        run: python -m unittest discover -s tests -p 'test_*.py'

  integration:
    name: WordPress / classic / HPOS / installable ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Start disposable WordPress
        run: |
          docker compose -f tests/compose.yml up -d db wordpress
          for attempt in $(seq 1 30); do
            if docker compose -f tests/compose.yml exec -T db healthcheck.sh --connect --innodb_initialized; then break; fi
            sleep 2
          done
          docker compose -f tests/compose.yml exec -T db healthcheck.sh --connect --innodb_initialized
          docker compose -f tests/compose.yml run --rm cli wp core install --url=http://localhost:8087 --title=Local --admin_user=localtester --admin_password=local-only-test-password --admin_email=test@example.invalid --skip-email
          docker compose -f tests/compose.yml run --rm cli wp plugin install woocommerce --version=10.3.0 --activate
          docker compose -f tests/compose.yml run --rm cli wp plugin activate y2kwebs-lafise
      - name: Both order storages and protected settings
        run: |
          for storage in no yes; do
            docker compose -f tests/compose.yml run --rm cli wp wc hpos sync
            docker compose -f tests/compose.yml run --rm cli wp option update woocommerce_custom_orders_table_enabled "$storage"
            test "$(docker compose -f tests/compose.yml run --rm cli wp option get woocommerce_custom_orders_table_enabled)" = "$storage"
            docker compose -f tests/compose.yml run --rm cli wp eval-file wp-content/plugins/y2kwebs-lafise/tests/integration.php
          done
          docker compose -f tests/compose.yml run --rm cli wp eval-file wp-content/plugins/y2kwebs-lafise/tests/settings.php
          docker compose -f tests/compose.yml run --rm cli wp eval-file wp-content/plugins/y2kwebs-lafise/tests/security.php
      - name: Build and exercise the release ZIP
        run: |
          python scripts/package.py
          python -m zipfile -e dist/y2kwebs-lafise-0.2.1.zip .runtime/release-check
          release_mount="$GITHUB_WORKSPACE/.runtime/release-check/y2kwebs-lafise:/var/www/html/wp-content/plugins/y2kwebs-lafise:ro"
          smoke_mount="$GITHUB_WORKSPACE/tests/release-smoke.php:/tmp/y2k-release-smoke.php:ro"
          docker compose -f tests/compose.yml run --rm --volume "$release_mount" cli wp plugin deactivate y2kwebs-lafise
          docker compose -f tests/compose.yml run --rm --volume "$release_mount" cli wp plugin activate y2kwebs-lafise
          docker compose -f tests/compose.yml run --rm --volume "$release_mount" --volume "$smoke_mount" cli wp eval-file /tmp/y2k-release-smoke.php
          cd dist
          sha256sum --check y2kwebs-lafise-0.2.1.zip.sha256
      - name: Plugin Check on the installable package
        run: |
          docker compose -f tests/compose.yml run --rm cli wp plugin install plugin-check --version=2.1.0 --activate
          release_mount="$GITHUB_WORKSPACE/.runtime/release-check/y2kwebs-lafise:/var/www/html/wp-content/plugins/y2kwebs-lafise:ro"
          docker compose -f tests/compose.yml run --rm --volume "$release_mount" cli wp --require=/var/www/html/wp-content/plugins/plugin-check/cli.php plugin check y2kwebs-lafise --format=csv --fields=type,code > .runtime/plugin-check.csv
          cat .runtime/plugin-check.csv
          if grep -qE '^"?(ERROR|WARNING)"?,' .runtime/plugin-check.csv; then exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: y2kwebs-lafise-0.2.1
          path: |
            dist/y2kwebs-lafise-0.2.1.zip
            dist/y2kwebs-lafise-0.2.1.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Stop disposable services
        if: always()
        run: docker compose -f tests/compose.yml down --volumes
