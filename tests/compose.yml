name: y2k-lafise-test
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: local-test-only
      MARIADB_ROOT_PASSWORD: local-root-test-only
    volumes:
      - db:/var/lib/mysql
  wordpress:
    image: wordpress:6.9-php8.2-apache
    ports:
      - "127.0.0.1:8087:80"
    environment:
      Y2K_LAFISE_LOCAL_TEST: "1"
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: local-test-only
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp:/var/www/html
      - ..:/var/www/html/wp-content/plugins/y2kwebs-lafise
      - ./ui-fixture.php:/var/www/html/wp-content/mu-plugins/y2k-local-test.php:ro
  cli:
    image: wordpress:cli-php8.2
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: local-test-only
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp:/var/www/html
      - ..:/var/www/html/wp-content/plugins/y2kwebs-lafise
volumes:
  db:
  wp:
